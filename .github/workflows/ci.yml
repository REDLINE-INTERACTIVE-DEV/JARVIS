name: JARVIS CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # CI exercises API/backend behavior; the optional local GGUF runtime is
      # installed separately from backend/requirements-llama.txt.
      - run: python -m pip install -r backend/requirements-ci.txt
      - run: PYTHONPATH=. python -m pytest -q backend/tests desktop/tests
      - run: python -m compileall -q notebook_bridge

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Verify HTTPS-only Android network policy
        run: |
          grep -Fq 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'cleartextTrafficPermitted="false"' android/app/src/main/res/xml/network_security_config.xml
          ! grep -Fq 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
          ! grep -Fq 'cleartextTrafficPermitted="true"' android/app/src/main/res/xml/network_security_config.xml
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - run: gradle --version
      - name: Build Android debug APK and unit tests
        run: gradle --no-daemon -p android :app:testDebugUnitTest :app:assembleDebug
      - name: Verify Android APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose android/app/build/outputs/apk/debug/app-debug.apk"
      - name: Rename Android APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "JARVIS-v0.13.0.apk"
      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: JARVIS-Android-v0.13.0
          path: JARVIS-v0.13.0.apk

  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r desktop/requirements.txt
      - run: pyinstaller --onefile --collect-all keyring --name jarvis-desktop desktop/main.py
      - uses: actions/upload-artifact@v7
        with:
          name: jarvis-desktop-linux
          path: dist/jarvis-desktop

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r desktop/requirements.txt
      - run: pyinstaller --onefile --windowed --collect-all keyring --name JARVIS desktop/main.py
      - uses: actions/upload-artifact@v7
        with:
          name: jarvis-desktop-windows
          path: dist/JARVIS.exe
