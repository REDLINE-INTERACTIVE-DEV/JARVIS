name: JARVIS CI
on: [push,pull_request]
jobs:
 backend:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: "3.12"}
   - run: pip install -r backend/requirements.txt
   - run: PYTHONPATH=. pytest -q backend/tests
 android:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: android-actions/setup-android@v3
   - uses: gradle/actions/setup-gradle@v4
   - run: gradle -p android :app:assembleDebug
   - uses: actions/upload-artifact@v4
     with: {name: jarvis-debug-apk,path: android/app/build/outputs/apk/debug/*.apk}
 desktop:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: "3.12"}
   - run: pip install -r desktop/requirements.txt
   - run: pyinstaller --onefile --name jarvis-desktop desktop/main.py
   - uses: actions/upload-artifact@v4
     with: {name: jarvis-desktop,path: dist/jarvis-desktop}