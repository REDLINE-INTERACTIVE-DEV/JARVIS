name: JARVIS CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - run: PYTHONPATH=. python -m pytest -q backend/tests

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Verify Gradle
        run: gradle --version
      - name: Build Android debug APK and unit tests
        run: gradle --no-daemon -p android :app:testDebugUnitTest :app:assembleDebug
      - name: Rename Android APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "JARVIS-v0.9.0.apk"
      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: JARVIS-Android-v0.9.0
          path: JARVIS-v0.9.0.apk

  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r desktop/requirements.txt
      - run: pyinstaller --onefile --name jarvis-desktop desktop/main.py
      - uses: actions/upload-artifact@v7
        with:
          name: jarvis-desktop-linux
          path: dist/jarvis-desktop

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r desktop/requirements.txt
      - run: pyinstaller --onefile --windowed --name JARVIS desktop/main.py
      - uses: actions/upload-artifact@v7
        with:
          name: jarvis-desktop-windows
          path: dist/JARVIS.exe
